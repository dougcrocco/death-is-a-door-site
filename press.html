<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Press Materials · Death Is a Door · CC Jasper</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=EB+Garamond:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0d0c0b}a{color:#7fa39b;text-decoration:none}a:hover{color:#a9c6bf}</style>
<script>(function(){var b='agreements/';fetch('agreements/tracker.html',{method:'HEAD'}).then(function(r){if(!r.ok)b='../agreements/';}).catch(function(){b='../agreements/';});document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[data-ag]');if(a)a.href=b+a.getAttribute('data-ag');},true);})();</script>
</helmet>
<div style="min-height:100vh;background:#0d0c0b;color:#e9e3d6;font-family:'EB Garamond',serif;padding:clamp(20px,4vw,48px);box-sizing:border-box;display:flex;flex-direction:column;gap:24px;">
  <div style="max-width:1400px;width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px 24px;">
  <div style="display:flex;align-items:center;gap:16px;"><img src="art/ccj-logo-light.png" alt="CC Jasper" style="display:block;height:18px;width:auto;"><span style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:#7fa39b;">Death Is a Door</span></div>
  <nav style="display:flex;flex-wrap:wrap;max-width:100%;gap:1px;background:#3a3630;border:1px solid #3a3630;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;box-sizing:border-box;">
    <a href="desk.html" style="flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;text-decoration:none;white-space:nowrap;background:#e9e3d6;color:#0d0c0b;" style-hover="background:#7fa39b;">← Desk</a>
    <a href="agreements/checklist.html" data-ag="checklist.html" style="flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;text-decoration:none;white-space:nowrap;background:#0d0c0b;color:#c4bcae;" style-hover="background:#16150f;color:#7fa39b;">Checklist</a>
    <a href="agreements/tracker.html" data-ag="tracker.html" style="flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;text-decoration:none;white-space:nowrap;background:#0d0c0b;color:#c4bcae;" style-hover="background:#16150f;color:#7fa39b;">Consignments</a>
    <a href="press.html" style="flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;text-decoration:none;white-space:nowrap;background:#1f1d19;color:#f0eadd;box-shadow:inset 0 -2px 0 #7fa39b;" style-hover="background:#16150f;color:#7fa39b;">Press materials</a>
    <a href="agreements/shipping.html" data-ag="shipping.html" style="flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;text-decoration:none;white-space:nowrap;background:#0d0c0b;color:#c4bcae;" style-hover="background:#16150f;color:#7fa39b;">Shipping</a>
    <a href="index.html" style="flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;text-decoration:none;white-space:nowrap;background:#0d0c0b;color:#c4bcae;" style-hover="background:#16150f;color:#7fa39b;">Site</a>
    <a href="install-plan.html#walkthrough" style="flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;text-decoration:none;white-space:nowrap;background:#0d0c0b;color:#c4bcae;" style-hover="background:#16150f;color:#7fa39b;">3D Walkthrough</a></nav>
  </div>
  <div style="max-width:1400px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;">
    <h1 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(36px,5vw,64px);line-height:1;color:#f0eadd;">Press Materials</h1>
    <div style="display:flex;flex-wrap:wrap;gap:1px;background:#3a3630;border:1px solid #3a3630;align-self:flex-start;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="1">
        <button onClick="{{ t.pick }}" style="background:{{ t.bg }};color:{{ t.fg }};border:none;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;padding:10px 16px;cursor:pointer;white-space:nowrap;box-shadow:{{ t.sh }};" style-hover="color:#7fa39b;">{{ t.label }}</button>
      </sc-for>
    </div>
  </div>
  <div style="max-width:1400px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;justify-content:flex-end;"><a href="{{ curSrc }}" target="_blank" rel="noopener" style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#7fa39b;">Open full page ↗</a></div>
    <iframe src="{{ curSrc }}" title="{{ curLabel }}" style="width:100%;flex:1;min-height:75vh;border:1px solid #3a3630;background:#0d0c0b;"></iframe>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const TABS = [{ label: 'Instagram Posts', src: 'book.html' }];
class Component extends DCLogic {
  state = { tab: 0 };
  renderVals() {
    const cur = TABS[this.state.tab] || TABS[0];
    return {
      curSrc: cur.src + '?embed=1', curLabel: cur.label,
      tabs: TABS.map((t, i) => { const on = i === this.state.tab; return { label: t.label, bg: on ? '#1f1d19' : '#0d0c0b', fg: on ? '#f0eadd' : '#c4bcae', sh: on ? 'inset 0 -2px 0 #7fa39b' : 'none', pick: () => this.setState({ tab: i }) }; })
    };
  }
}
</script>
</body>
</html>
